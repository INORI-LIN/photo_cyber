name: docker

# Build the all-in-one Docker image (Python 3.11 + uv + photoguard extra +
# baked-in SD VAE) and smoke-test it. Image is NOT pushed — that step is
# left to a manual release workflow once the user opts in.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted runners come with ~14GB free; our image exports torch
      # + nvidia-cudnn/cublas + SD VAE which together unpack to ~6GB and
      # that's before buildx's own cache. Free up the language toolchains
      # we don't use (dotnet, android, ghc, hosted tool cache, swap) — gives
      # ~30GB headroom and is the canonical fix for "no space left on device"
      # in container builds on ubuntu-latest.
      - name: Free up disk space on the runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: photo-guard:ci
          push: false
          load: true
          # Cache the torch+diffusers+model layers across runs — without
          # this, every CI run re-downloads ~5 GB of wheels and the SD
          # VAE.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate a synthetic test image
        # Use Pillow inside the just-built image rather than the runner's
        # host Python (free-disk-space wiped the runner's tool cache, so
        # Pillow may not be present; and AGENTS.md §6.4 forbids installing
        # one directly). The container already has Pillow from the
        # photoguard extra.
        # Override the entrypoint so we can run python directly against the
        # baked-in venv instead of the photo-guard CLI.
        run: |
          mkdir -p fixtures
          docker run --rm --entrypoint /app/.venv/bin/python \
              -v "$PWD/fixtures:/work" \
              photo-guard:ci \
              -c "from PIL import Image; Image.new('RGB', (640, 480), (200, 180, 160)).save('/work/in.jpg', quality=92)"

      - name: Smoke test — protect (noise perturber) + verify
        run: |
          noise_output=$(docker run --rm \
              -v "$PWD/fixtures:/work" \
              photo-guard:ci \
              protect /work/in.jpg -o /work/out.jpg \
              --layers invisible,perturb,visible \
              --payload "ci-test" \
              --perturber noise)

          echo "$noise_output"
          echo "$noise_output" | grep -F "layers=invisible+perturb+visible"
          echo "$noise_output" | grep -F "perturber=noise"
          test -s fixtures/out.jpg

          # P19: the clue path exits 3, so the command must not run under `bash -e` directly.
          set +e
          recovered=$(docker run --rm \
              -v "$PWD/fixtures:/work" \
              photo-guard:ci \
              verify /work/out.jpg --payload-bytes 7)
          clue_rc=$?
          set -e

          echo "recovered: $recovered"
          # P3: the checksum-less path labels its output as a clue, so the exact line is
          # asserted rather than a substring match — a bare "ci-test" is no longer printed.
          # The comparison itself is byte-wise (bash `=`, unaffected by locale), but the
          # container's stdout encoding is a real dependency, so a mismatch dumps the bytes:
          # that is what tells an encoding problem apart from a genuine output change.
          # P19: and the exit code must say "clue", not "verified".
          if [ "$clue_rc" != "3" ]; then
            echo "::error::the clue path must exit 3, got $clue_rc"
            exit 1
          fi
          if [ "$recovered" != "线索（未验证）: ci-test" ]; then
            echo "::error::unexpected verify output"
            printf '%s' "$recovered" | od -c | head -5
            exit 1
          fi

      # Strongest evidence the SD VAE is actually baked in: run with
      # --network none so any HuggingFace request would fail. PGD on CPU
      # is slow but bounded (~30s for 5 steps on 640x480). Keep step count
      # low to keep CI under a minute.
      - name: Smoke test — offline SD perturber
        run: |
          sd_output=$(docker run --rm \
              --network none \
              -v "$PWD/fixtures:/work" \
              photo-guard:ci \
              protect /work/in.jpg -o /work/out_sd.jpg \
              --layers invisible,perturb,visible \
              --payload "ci-test" \
              --perturber sd \
              --perturber-steps 2 \
              --long-edge 384)

          echo "$sd_output"
          echo "$sd_output" | grep -F "layers=invisible+perturb+visible"
          echo "$sd_output" | grep -F "perturber=sd"
          test -s fixtures/out_sd.jpg

      # P15: the loader must refuse a model directory with no safetensors instead of falling
      # back to pickle. Only config.json is staged, so there are no weights to load at all —
      # the same guard that rejects a `.bin`-only directory.
      - name: Smoke test — a model directory without safetensors is refused
        run: |
          docker run --rm --entrypoint /bin/sh \
              -v "$PWD/fixtures:/work" \
              photo-guard:ci \
              -c "mkdir -p /work/no-safetensors && cp /app/models/sd-vae-ft-mse/config.json /work/no-safetensors/config.json"
          set +e
          refusal=$(docker run --rm \
              --network none \
              -v "$PWD/fixtures:/work" \
              photo-guard:ci \
              protect /work/in.jpg -o /work/refused.jpg \
              --layers invisible \
              --perturber sd \
              --perturber-model /work/no-safetensors \
              --perturber-steps 2 \
              --long-edge 384 2>&1)
          rc=$?
          set -e
          echo "refusal rc=$rc"
          echo "$refusal"
          if [ "$rc" -eq 0 ]; then
            echo "::error::a model directory without safetensors was accepted"
            exit 1
          fi
          echo "$refusal" | grep -F "safetensors"
          if [ -e fixtures/refused.jpg ]; then
            echo "::error::an output file was written despite the refusal"
            exit 1
          fi
