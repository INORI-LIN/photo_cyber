name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # Don't kill the whole matrix if one OS fails — we want to see both
      # results to know whether a regression is OS-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Compliance grep (AGENTS.md 6.4)
        # Linux-only because the AGENTS.md §6.4-style grep is shell-specific.
        # tests/test_compliance.py reproduces the same check in pure Python
        # and runs on every OS via pytest, so coverage is preserved on Windows.
        if: runner.os == 'Linux'
        run: |
          set -e
          # Match the literal "pip<space>install" anywhere except docs / lock /
          # the test file that documents the rule itself. Any hit fails CI per
          # AGENTS.md 6.4: "可在 CI 加一道检查：检索脚本与文档中是否出现
          # `pip install`，命中即判失败".
          if grep -RIn \
                  --exclude-dir=.venv --exclude-dir=.git --exclude-dir=.github \
                  --exclude=uv.lock --exclude=AGENTS.md --exclude=README.md \
                  --exclude=test_compliance.py \
                  "pip install" .; then
            echo "::error::pip install reference found — AGENTS.md 6 forbids pip"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.11

      - name: Sync (frozen, dev group)
        run: uv sync --frozen --group dev

      - name: Core-only contract (no torch, one cv2, haar data)
        # G1: the core install must not drag torch in, must not ship a second cv2 build,
        # and must still find the Haar cascade that the subject path falls back to.
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.metadata as md
          import importlib.util as iu
          import sys
          from pathlib import Path

          heavy = {
              "torch", "triton", "diffusers", "transformers", "accelerate",
              "safetensors", "huggingface-hub", "imwatermark", "invisible-watermark",
          }
          offenders = []
          for dist in md.distributions():
              low = (dist.metadata["Name"] or "").strip().lower()
              if low in heavy or low.startswith(("nvidia-", "cuda-")):
                  offenders.append((low, dist.version))
              elif low.startswith("opencv-") and low != "opencv-python-headless":
                  offenders.append((low, dist.version))
          if offenders:
              print("core env carries forbidden distributions:", offenders)
              sys.exit(1)
          if iu.find_spec("torch") is not None:
              print("torch is importable in the core-only environment")
              sys.exit(1)

          import cv2

          cascade = Path(cv2.data.haarcascades) / "haarcascade_frontalface_default.xml"
          if not cascade.is_file() or cv2.CascadeClassifier(str(cascade)).empty():
              print(f"haar cascade unusable: {cascade}")
              sys.exit(1)
          print("core-only contract OK")
          PY
          uv run --no-sync photo-guard --help >/dev/null

      - name: Run pytest (fast tier only)
        run: uv run pytest -m 'not slow' -v
