name: release-desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release must never be cancelled midway through publishing; queue instead.
  cancel-in-progress: false

jobs:
  verify:
    # G5/G6: nothing is built until the fast tier is green and the tag matches pyproject.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.11
      - name: Lock must round-trip through this uv (format + semantics)
        # `uv lock --check` accepts a previous lock format, so the only reliable guard is a
        # rewrite-and-diff (a different uv would rewrite the whole file).
        run: |
          uv lock --offline
          git diff --exit-code -- uv.lock
      - run: uv sync --frozen --group dev
      - name: Fast test tier
        run: uv run --no-sync pytest -m 'not slow' -q
      - name: Tag must match the pyproject version
        run: |
          V=$(uv run --no-sync python packaging/build_desktop.py --print-version)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${V}"
            exit 1
          fi
          echo "version ${V} accepted for ${GITHUB_REF_NAME:-workflow_dispatch}"
      - name: Qt runtime libraries for the GUI release gate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libglib2.0-0 libdbus-1-3
      - name: Sync (frozen, dev + desktop extra)
        run: uv sync --frozen --group dev --extra desktop
      - name: PySide6 must import (no importorskip release gate)
        run: uv run --no-sync python -c "import PySide6"
      - name: GUI tier must run without skipped cases
        run: |
          set -euo pipefail
          QT_QPA_PLATFORM=offscreen uv run --no-sync pytest -m gui -q | tee "$RUNNER_TEMP/gui-pytest.log"
          # pytest 在零用例时退 5；全跳过或部分跳过也不能打开发布门。
          if ! grep -Eq '(^|[ ,])[1-9][0-9]* passed([ ,]|$)' "$RUNNER_TEMP/gui-pytest.log" \
            || grep -Eq '(^|[ ,])[1-9][0-9]* skipped([ ,]|$)' "$RUNNER_TEMP/gui-pytest.log"; then
            echo "::error::GUI tier has no passing cases or contains skips"
            exit 1
          fi
      - name: GUI entry point answers --help without opening Qt
        run: QT_QPA_PLATFORM=offscreen timeout 60 uv run --no-sync photo-guard-gui --help

  windows:
    needs: verify
    runs-on: windows-latest
    # P76: measured 3h02m (macOS) / about 2h50m (Windows, installer included) per build leg;
    # 300 leaves headroom without letting a hang burn the 6-hour hosted-runner limit.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen --extra photoguard --extra desktop --group package --group dev
      - name: Third-party notices must match this environment (G2)
        run: uv run --no-sync python packaging/generate_notices.py --check
      - name: Fast test tier against the release dependency set (P69)
        # P69: the build legs never ran the suite, so a regression in the exact extras the
        # bundle is built from only surfaced after a ~40-minute Nuitka round. The GUI cases
        # run here for the first time on this OS; a red is a defect to fix, not to exclude.
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          uv run --no-sync pytest -m 'not slow' -q
      - run: uv run --no-sync photo-guard download-models
      - run: uv run --no-sync python packaging/build_desktop.py
      - name: Smoke test standalone application
        shell: powershell
        # P76: Start-Process -Wait has no timeout of its own; a hung bundle must fail this
        # step instead of holding the runner until the job limit.
        timeout-minutes: 30
        # DOC6/P69: the bundle claims PyTorch + diffusers + Qt; the flags make a build that
        # dropped any of them fail here instead of on the user's first run.
        # P75: PhotoGuard.exe is built with --windows-console-mode=disable, i.e. it is a
        # GUI-subsystem program. A bare call neither waits for it nor sets $LASTEXITCODE: run
        # 44473940993 printed the exit-5 message and this step was still green. Start-Process
        # -Wait -PassThru reports the real ExitCode ($null fails the step, it is never a pass).
        # Its output goes to files that are echoed through Out-Host, because anything else a
        # PowerShell function emits becomes part of its return value; both call sites also
        # reject a result that is not an [int], so a polluted return (an array, or $null)
        # cannot compare as a pass. Strings use "${Label}:", since "$Label:" would parse as a
        # drive-qualified variable.
        # P75/P76: the negative control points the resource root at an empty directory (model
        # and licences missing) and must exit exactly 2, proving that this step sees a failing
        # exit code at all. The override is cleared in `finally`, so the real smoke never
        # inherits it.
        run: |
          $exe = (Resolve-Path -LiteralPath "dist\desktop_entry.dist\PhotoGuard.exe").ProviderPath
          Write-Host "running: $exe"
          function Invoke-Smoke {
            param([string]$Label, [string[]]$Arguments)
            $stdoutFile = Join-Path $env:RUNNER_TEMP "smoke-${Label}.stdout.txt"
            $stderrFile = Join-Path $env:RUNNER_TEMP "smoke-${Label}.stderr.txt"
            $proc = Start-Process -FilePath $exe -ArgumentList $Arguments -NoNewWindow -Wait -PassThru `
              -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
            Write-Host "--- ${Label} stdout ---"
            Get-Content -LiteralPath $stdoutFile -Encoding UTF8 | Out-Host
            Write-Host "--- ${Label} stderr ---"
            Get-Content -LiteralPath $stderrFile -Encoding UTF8 | Out-Host
            if ($null -eq $proc.ExitCode) { throw "${Label}: the process reported no exit code" }
            $code = [int]$proc.ExitCode
            Write-Host "${Label} exit code: $code"
            return $code
          }
          $empty = Join-Path $env:RUNNER_TEMP "smoke-empty-resources"
          New-Item -ItemType Directory -Force -Path $empty | Out-Null
          $env:PHOTO_GUARD_RESOURCE_DIR = $empty
          try {
            $neg = Invoke-Smoke -Label "negative-control" -Arguments @("--smoke-test")
          } finally {
            $env:PHOTO_GUARD_RESOURCE_DIR = $null
          }
          if ($neg -isnot [int] -or $neg -ne 2) {
            throw "negative control must exit 2 (bundle model missing), got $neg"
          }
          $rc = Invoke-Smoke -Label "smoke" -Arguments @("--smoke-test", "--with-photoguard", "--with-gui")
          if ($rc -isnot [int] -or $rc -ne 0) { throw "smoke test failed (exit $rc)" }
      - name: Licence material is inside the built tree (G2)
        shell: powershell
        run: |
          foreach ($name in @("LICENSE", "THIRD_PARTY_NOTICES.md", "GPL-3.0.txt", "LICENSE-3RD-PARTY-opencv.txt")) {
            $found = Get-ChildItem -Recurse -File "dist\desktop_entry.dist" -Filter $name | Select-Object -First 1
            if (-not $found) { throw "$name is missing from dist\desktop_entry.dist" }
            Write-Host "found: $($found.FullName)"
          }
      - name: Locate ISCC (P23)
        shell: powershell
        run: |
          # The resolver checks ISCC_PATH -> PATH -> the Inno Setup registry entries
          # -> the two Program Files locations.  Native commands do not throw on a
          # non-zero exit under $ErrorActionPreference, so check the code explicitly.
          $raw = uv run --no-sync python packaging\find_iscc.py
          $code = $LASTEXITCODE
          $ISCC = ($raw | Select-Object -Last 1)
          if ($null -eq $ISCC) { $ISCC = "" } else { $ISCC = $ISCC.Trim() }
          if ($code -ne 0) { throw "ISCC resolver failed (exit $code)" }
          if (-not (Test-Path -LiteralPath $ISCC -PathType Leaf)) {
            throw "ISCC.exe not found at '$ISCC'"
          }
          # GITHUB_ENV is shared with later steps; UTF-8 without BOM is what the runner reads.
          [IO.File]::AppendAllText($env:GITHUB_ENV, "ISCC=$ISCC`n", [Text.UTF8Encoding]::new($false))
          Write-Host "ISCC: $ISCC"
      - name: Build installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $V = (uv run --no-sync python packaging\build_desktop.py --print-version).Trim()
          & $env:ISCC "/DMyAppVersion=$V" packaging\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }
      - name: Checksums (SHA256, sha256sum-compatible)
        shell: powershell
        run: |
          # Enumerate first, write second. PowerShell opens the redirection target *before*
          # it runs the pipeline, so the old `Get-FileHash release\* | … | Out-File
          # release\SHA256SUMS.txt` tried to hash the very file it was writing: measured on
          # windows-latest 2026-09-29 — "The file '…\SHA256SUMS.txt' cannot be read: … being
          # used by another process" → exit 1, and the upload + release steps were skipped.
          $sums = Get-ChildItem -LiteralPath release -File |
            Where-Object { $_.Name -notlike 'SHA256SUMS*' } |
            ForEach-Object {
              "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
            }
          # Explicit ASCII + LF: `Out-File` defaults to UTF-16 with CRLF and a table layout,
          # which nothing else can parse. Platform-suffixed name so the macOS leg's file
          # cannot be clobbered by this one in the shared release.
          [System.IO.File]::WriteAllText("$PWD\release\SHA256SUMS-Windows-x64.txt",
            (($sums -join "`n") + "`n"), [System.Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@v7
        with:
          name: PhotoGuard-Windows-x64
          path: release/*
          # P69: a build that produced nothing used to leave an empty artifact behind and
          # only fail in the publish job.
          if-no-files-found: error

  macos-arm64:
    needs: verify
    runs-on: macos-15
    # P76: same budget as the Windows leg (measured 3h02m here); see the comment there.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen --extra photoguard --extra desktop --group package --group dev
      - name: Third-party notices must match this environment (G2)
        run: uv run --no-sync python packaging/generate_notices.py --check
      - name: Fast test tier against the release dependency set (P69)
        # Same rationale as the Windows leg: run the suite against the exact extras the
        # bundle is built from, on this OS, before spending the Nuitka round.
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest -m 'not slow' -q
      - run: uv run --no-sync photo-guard download-models
      - run: uv run --no-sync python packaging/build_desktop.py
      - name: Licence material is inside the app bundle (G2)
        # Runs *before* the smoke test on purpose: this is a pure filesystem check, so when the
        # smoke test fails the log still shows whether (and where) the material landed.
        run: |
          APP=$(find dist -maxdepth 1 -name "*.app" -print -quit)
          echo "bundle: $APP"
          for name in LICENSE THIRD_PARTY_NOTICES.md GPL-3.0.txt LICENSE-3RD-PARTY-opencv.txt; do
            found=$(find "$APP" -name "$name" -print -quit)
            if [ -z "$found" ]; then
              echo "::error::$name is missing from $APP"
              echo "--- Contents ---"
              ls -la "$APP/Contents" || true
              exit 1
            fi
            echo "found: $found"
          done
      - name: Smoke test app bundle
        # P76: a hung bundle must fail this step instead of holding the runner for hours.
        timeout-minutes: 30
        # The entry point locates the licence material through resources.application_root()
        # and returns 4 when it is missing (G2), so this is also the S2 layout check.
        # NB: pick the app's own executable explicitly. The bundle's Contents/MacOS also holds
        # Nuitka-frozen helpers (torch/bin/protoc, torch_shm_manager, …), and a bare
        # `find … -perm +111 -print -quit` picked one of those — it answered
        # "Missing value for flag: --smoke-test" and the real smoke test never ran.
        run: |
          APP=$(find dist -maxdepth 1 -name "*.app" -print -quit)
          BIN="$APP/Contents/MacOS/desktop_entry"
          if [ ! -x "$BIN" ]; then
            BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm +111 -print -quit)
          fi
          echo "running: $BIN"
          # P75/P76: negative control first. An empty resource root holds neither the model
          # nor the licences, so the bundle must exit with exactly 2 (its first failing
          # check); any other code means this step cannot tell a broken bundle from a good
          # one. The variable prefixes that single command, so the real smoke never sees it.
          EMPTY="$RUNNER_TEMP/smoke-empty-resources"
          mkdir -p "$EMPTY"
          neg=0
          PHOTO_GUARD_RESOURCE_DIR="$EMPTY" "$BIN" --smoke-test || neg=$?
          echo "negative-control exit code: $neg"
          if [ "$neg" -ne 2 ]; then
            echo "::error::negative control must exit 2 (bundle model missing), got $neg"
            exit 1
          fi
          # DOC6/P69: --with-photoguard also requires the shipped torch/diffusers and
          # --with-gui requires a startable Qt with its platform plugins.
          # P76: the old negated `if` around the smoke reported every failure as 1; keep the
          # bundle's own code so the log says which check failed. `cmd || rc=$?` is safe
          # under `bash -e`; no pipe, or $? would be the last stage's status.
          rc=0
          "$BIN" --smoke-test --with-photoguard --with-gui || rc=$?
          echo "smoke exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            echo "::error::smoke test failed (exit $rc) — dumping layout for diagnosis"
            ls -la "$APP/Contents" || true
            # `|| true`: a find error must not end the script (e.g. under pipefail) before
            # it exits with the smoke's own code.
            find "$APP/Contents" -maxdepth 3 \
              \( -name "config.json" -o -name "THIRD_PARTY_NOTICES.md" \) -print | head -10 || true
            exit "$rc"
          fi
      - run: packaging/create_dmg.sh
      - name: Checksums (SHA256, sha256sum-compatible)
        # Same self-inclusion trap as the Windows leg: the shell opens the redirection
        # target before the loop runs, so enumerate inside release/ and skip SHA256SUMS*.
        # Quoted "$f" keeps names with spaces safe (the DMG currently has none, the
        # licence-material staging in create_dmg.sh shows how fast that can change).
        run: |
          ( cd release && for f in *; do
              [ -f "$f" ] || continue
              case "$f" in SHA256SUMS*) continue;; esac
              shasum -a 256 "$f"
            done ) > release/SHA256SUMS-macOS-arm64.txt
      - uses: actions/upload-artifact@v7
        with:
          name: PhotoGuard-macOS-arm64
          path: release/*
          if-no-files-found: error
  publish:
    # 手工调度即使选中 tag ref，也只能构建工件，不能创建 Release。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [verify, windows, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PhotoGuard-Windows-x64
          path: release/windows
      - uses: actions/download-artifact@v8
        with:
          name: PhotoGuard-macOS-arm64
          path: release/macos-arm64
      - name: Verify both artifact trees before publishing
        run: |
          set -euo pipefail
          test -s release/windows/PhotoGuard-Windows-x64-Setup.exe
          test -s release/windows/SHA256SUMS-Windows-x64.txt
          grep -Eq '^[[:xdigit:]]{64}  PhotoGuard-Windows-x64-Setup.exe$' \
            release/windows/SHA256SUMS-Windows-x64.txt
          (cd release/windows && sha256sum -c SHA256SUMS-Windows-x64.txt)
          test -s release/macos-arm64/PhotoGuard-macOS-arm64.dmg
          test -s release/macos-arm64/SHA256SUMS-macOS-arm64.txt
          grep -Eq '^[[:xdigit:]]{64}  PhotoGuard-macOS-arm64.dmg$' \
            release/macos-arm64/SHA256SUMS-macOS-arm64.txt
          (cd release/macos-arm64 && sha256sum -c SHA256SUMS-macOS-arm64.txt)
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" \
            release/windows/PhotoGuard-Windows-x64-Setup.exe \
            release/windows/SHA256SUMS-Windows-x64.txt \
            release/macos-arm64/PhotoGuard-macOS-arm64.dmg \
            release/macos-arm64/SHA256SUMS-macOS-arm64.txt --clobber
