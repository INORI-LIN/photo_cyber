[project]
name = "photo-guard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "inori-lin", email = "inori-lin@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "invisible-watermark>=0.2.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.2.0",
]

[project.scripts]
photo-guard = "photo_guard:main"

[project.optional-dependencies]
photoguard = [
    "accelerate>=1.14.0",
    "diffusers>=0.38.0",
    "safetensors>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: requires torch + diffusers and a HuggingFace model download (excluded from CI)",
]
